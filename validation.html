<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Ticket – Cyber Conférence 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0B1E36;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border-left: 5px solid #00FF88;
        }
        .card .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .card h1 {
            color: #0B1E36;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .card .sub {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }
        #result {
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            background: #f5f7fa;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .valid {
            color: #0B1E36;
            background: #d4edda !important;
            border-left: 5px solid #28a745;
        }
        .invalid {
            color: #721c24;
            background: #f8d7da !important;
            border-left: 5px solid #dc3545;
        }
        .used {
            color: #856404;
            background: #fff3cd !important;
            border-left: 5px solid #ffc107;
        }
        .info {
            font-size: 13px;
            color: #777;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .info span {
            background: #0B1E36;
            color: #00FF88;
            padding: 2px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: #0B1E36;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #00FF88;
            color: #0B1E36;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">🔐</div>
    <h1>VigiCyberDefense</h1>
    <p class="sub">Conférence – Luanda, 13 agosto 2026</p>

    <div id="result">
        🔍 Scan en cours...
    </div>

    <div class="info">
        <span>JETÃO ÚNICO</span> – Cada bilhete é pessoal e intransferível..
    </div>
    <a href="#" class="btn" onclick="window.location.reload();">🔄 Tentar novamente.</a>
</div>

<script>
    // ========================================
    // 1. LISTE DES JETONS VALIDES (UNIQUES)
    // ========================================
    // Ajoute ici TOUS les codes que tu distribues sur les tickets.
    // Chaque code doit être unique.
    const validTokens = [
        'TKT-001', 'TKT-002', 'TKT-003', 'TKT-004', 'TKT-005',
        'TKT-006', 'TKT-007', 'TKT-008', 'TKT-009', 'TKT-010',
        'TKT-011', 'TKT-012', 'TKT-013', 'TKT-014', 'TKT-015',
        'TKT-016', 'TKT-017', 'TKT-018', 'TKT-019', 'TKT-020',
        'TKT-021', 'TKT-022', 'TKT-023', 'TKT-024', 'TKT-025',
        'TKT-026', 'TKT-027', 'TKT-028', 'TKT-029', 'TKT-030'
    ];

    // ========================================
    // 2. LISTE DES JETONS DÉJÀ UTILISÉS
    // ========================================
    // Pour l'instant vide. Après la conférence, tu pourras
    // ajouter manuellement les codes utilisés pour simulation.
    // Exemple : 'TKT-001', 'TKT-005'
    const usedTokens = []; // ← ajoute ici les codes déjà scannés

    // ========================================
    // 3. LOGIQUE DE VALIDATION
    // ========================================
    function validateTicket() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const resultDiv = document.getElementById('result');

        // CAS 1 : Pas de token dans l'URL
        if (!token) {
            resultDiv.innerHTML = '❌ Lien invalide : aucun jeton détecté.';
            resultDiv.className = 'invalid';
            return;
        }

        // CAS 2 : Token valide ?
        if (!validTokens.includes(token)) {
            resultDiv.innerHTML = '❌ Ticket invalide. Ce code n\'existe pas.';
            resultDiv.className = 'invalid';
            return;
        }

        // CAS 3 : Token déjà utilisé ?
        if (usedTokens.includes(token)) {
            resultDiv.innerHTML = '⚠️ Ce ticket a déjà été utilisé. Contacter l\'organisateur.';
            resultDiv.className = 'used';
            return;
        }

        // CAS 4 : TOUT EST BON
        resultDiv.innerHTML = '✅ Bilhete válido ! Seja bem-vindo à conferênçia.';
        resultDiv.className = 'valid';

        // (Optionnel) Ajouter le token à la liste des utilisés
        // usedTokens.push(token); // si tu veux qu'il soit marqué utilisé après scan
    }

    // ========================================
    // 4. EXÉCUTION
    // ========================================
    validateTicket();
</script>

</body>
</html>
